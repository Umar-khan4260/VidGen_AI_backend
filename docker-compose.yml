# VidGen AI backend — Docker Compose (single configuration file)
#
# No Dockerfile is used: everything is defined here.
#   - Base image: node:20-alpine
#   - App code is mounted from ./functions (dev-friendly, no rebuild needed)
#   - Port is read from backend/.env via ${PORT:-8080}
#   - Secrets (.env, service-account-key.json) are injected at runtime,
#     never baked into an image.
#
# Usage:
#   nano .env                   # create and fill .env with secrets
#   docker compose up -d

services:
  app:
    image: node:20-alpine
    container_name: vidgen-ai-backend
    init: true
    restart: unless-stopped

    # Port: host:container, both read from .env (PORT=8080 by default)
    ports:
      - "${PORT:-8080}:${PORT:-8080}"

    # Load all variables from backend/.env at runtime.
    env_file:
      - path: .env
        required: false

    # Docker-specific overrides (PORT comes from .env via interpolation).
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-8080}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account-key.json

    volumes:
      # Mount the functions folder so code changes are picked up without rebuild.
      - ./functions:/app
      # Firebase Admin service-account key (read-only).
      - ./service-account-key.json:/app/service-account-key.json:ro
      # Keep container node_modules untouched by host mounts.
      - /app/node_modules

    # Install production deps then start the Express server.
    # Uses npm install (not npm ci) so it works even if package-lock.json is missing.
    command: >
      sh -c "npm install --omit=dev --no-audit --no-fund && node src/server.js"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://127.0.0.1:${PORT:-8080}/api/models"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - vidgen-backend

networks:
  vidgen-backend:
    driver: bridge
